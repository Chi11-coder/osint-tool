services:
  go:
    container_name: go
    build: ./backend
    ports:
      - "4000:4000"
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
          target: /app/package.json
        - action: rebuild
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
          